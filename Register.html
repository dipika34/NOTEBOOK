<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTEBOOK APPLICATION</title>
    <link rel="stylesheet" href="style.css">
    <script src="note.js"></script>
</head>

<body>
    <div class="Main">
        <div class="texts">
            <h1>NoteBook App</h1>
            <h2>Register</h2>
            <div class="login">
                <form>
                    <div class="details">
                        <label for="username">UserName</label><br>
                        <input type="text" placeholder="enter your username" name="username" id="name"><br></br>
                        <label for="password">Password</label><br>
                        <input type="password" placeholder="enter your password" name="password" id="password"><br>
                        <a href="#" id="link1">Forgot your password?</a>
                        <br>
                    </div>
                    <center>
                        <div class="account">
                            <input type="submit" value="LOGIN" id="btn" onclick="Login()"><br>
                            <a href="#">Do you have already account?</a>
                        </div>
                    </center>
                </form>
            </div>
        </div>
</body>

</html>
